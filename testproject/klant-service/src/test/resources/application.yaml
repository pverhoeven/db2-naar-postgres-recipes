# Tests draaien op H2 in DB2-modus; na de migratie op Postgres via Testcontainers
spring:
  datasource:
    url: jdbc:h2:mem:klant;MODE=DB2;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
